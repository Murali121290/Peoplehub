upstream peoplehub_backend {
    server backend:5001;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # Trust the Docker bridge gateway and host networks so $remote_addr becomes the real client IP
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 50M;

    # Connection keep-alive for better throughput
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Proxy buffer tuning â€” prevents large responses buffering to disk (/var/cache/nginx/proxy_temp)
    proxy_buffer_size          128k;
    proxy_buffers              8 256k;
    proxy_busy_buffers_size    512k;

    root /usr/share/nginx/html;
    index index.html;

    # â”€â”€ Gzip Compression â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    # Compresses both static assets and proxied API JSON responses.
    # Evaluation data alone drops from 11.5 MB â†’ 440 KB (96% smaller).
    gzip on;
    gzip_vary on;
    gzip_proxied any;          # compress all proxied responses (incl. /api/)
    gzip_comp_level 6;         # level 6: best balance of CPU vs size reduction
    gzip_min_length 1024;      # only compress responses â‰¥ 1 KB (skip tiny ones)
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/x-www-form-urlencoded
        image/svg+xml
        font/woff
        font/woff2;

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /api/ {
        proxy_pass http://peoplehub_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Pass the browser's Accept-Encoding so nginx can gzip the upstream response
        proxy_set_header Accept-Encoding $http_accept_encoding;

        # Use X-Forwarded-Proto from outer SSL proxy if present, fallback to local scheme
        set $proto $http_x_forwarded_proto;
        if ($proto = "") {
            set $proto $scheme;
        }
        proxy_set_header X-Forwarded-Proto $proto;
    }

    location ^~ /uploads/ {
        proxy_pass http://peoplehub_backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io/ {
        proxy_pass http://peoplehub_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
