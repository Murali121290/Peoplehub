services:
  postgres:
    image: postgres:15-alpine
    container_name: peoplehub_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: peoplehub_backend
    restart: always
    depends_on:
      - postgres
    working_dir: /app
    command: uvicorn app:app --host 0.0.0.0 --port 5001 --reload
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TZ: ${TZ}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "${BACKEND_PORT}:5001"
    volumes:
      - ./backend:/app

  frontend:
    image: nginx:alpine
    container_name: peoplehub_nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  postgres_data:
