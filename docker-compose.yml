services:
  postgres:
    image: postgres:15-alpine
    container_name: peoplehub_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres -c shared_buffers=512MB -c effective_cache_size=2GB -c work_mem=16MB -c maintenance_work_mem=256MB -c max_connections=100 -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c random_page_cost=1.1 -c log_min_duration_statement=1000

  redis:
    image: redis:7-alpine
    container_name: peoplehub_redis
    restart: always
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: peoplehub_backend
    restart: always
    depends_on:
      - postgres
      - redis
    working_dir: /app
    command: uvicorn app:app --host 0.0.0.0 --port 5001 --workers 4 --proxy-headers --forwarded-allow-ips='*'
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TZ: ${TZ}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      BACKEND_URL: ${BACKEND_URL}
      MAIL_SERVER: ${MAIL_SERVER}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USE_TLS: ${MAIL_USE_TLS}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER}
      EMAILJS_SERVICE_ID: ${EMAILJS_SERVICE_ID}
      EMAILJS_TEMPLATE_ID: ${EMAILJS_TEMPLATE_ID}
      EMAILJS_PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY}
      OFFICE_IP_PREFIXES: ${OFFICE_IP_PREFIXES}
      MYSQL_BIOMETRIC_HOST: ${MYSQL_BIOMETRIC_HOST}
      MYSQL_BIOMETRIC_PORT: ${MYSQL_BIOMETRIC_PORT}
      MYSQL_BIOMETRIC_USER: ${MYSQL_BIOMETRIC_USER}
      MYSQL_BIOMETRIC_PASSWORD: ${MYSQL_BIOMETRIC_PASSWORD}
      MYSQL_BIOMETRIC_DB: ${MYSQL_BIOMETRIC_DB}
      SYNC_API_SECRET: ${SYNC_API_SECRET}
      CMS_SYNC_URL: ${CMS_SYNC_URL}
    ports:
      - "${BACKEND_PORT}:5001"
    volumes:
      - ./backend:/app
      # Mount NFS directory for uploads
      - ./data/uploads:/opt/uploads

  frontend:
    image: nginx:alpine
    container_name: peoplehub_nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  postgres_data:
  redis_data:
